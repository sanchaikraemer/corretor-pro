<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel administrativo — Corretor Pro</title>
<link rel="stylesheet" href="contas-estilo.css?v=__VERSION__">
<script src="vendor/supabase.js?v=__VERSION__"></script>
<script src="contas-config.js?v=__VERSION__"></script>
</head>
<body>
  <div>
    <div class="marca">
      <img src="logo-cp.png" alt="">
      <b>Corretor <strong>Pro</strong></b>
    </div>
    <div class="cartao larga" id="areaLogin">
      <h1>Entrar como administrador</h1>
      <p class="sub">Este painel é só pra quem administra a plataforma inteira (você).</p>
      <label>E-mail</label>
      <input id="email" type="email" placeholder="seuemail@email.com">
      <label>Senha</label>
      <div class="campo-senha">
        <input id="senha" type="password" placeholder="••••••">
        <button type="button" class="btn-olho" onclick="alternarSenha('senha', this)" aria-label="Mostrar senha"></button>
      </div>
      <button onclick="entrarAdmin()">Entrar</button>
      <div id="msgLogin"></div>
    </div>

    <div class="cartao painel-largo" id="areaPainel" style="display:none">
      <div class="rodape-conta">
        <div><b>Painel administrativo</b><div class="tag-empresa">Todos os corretores cadastrados</div></div>
        <button class="secundario pequeno" onclick="location.reload()">Sair</button>
      </div>

      <div class="stats-admin">
        <div class="stat-tile"><span>Total de corretores</span><b id="statTotal">0</b></div>
        <div class="stat-tile teste"><span>Em teste</span><b id="statTeste">0</b></div>
        <div class="stat-tile ativo"><span>Ativos (pagando)</span><b id="statAtivo">0</b></div>
        <div class="stat-tile bloqueado"><span>Bloqueados</span><b id="statBloqueado">0</b></div>
      </div>

      <div class="filtros-admin">
        <input id="buscaCorretor" placeholder="Buscar corretor pelo nome..." oninput="buscarCorretor(this.value)">
        <button class="chip selecionado" onclick="filtrarPorStatus('todos', this)">Todos</button>
        <button class="chip" onclick="filtrarPorStatus('teste', this)">Em teste</button>
        <button class="chip" onclick="filtrarPorStatus('ativo', this)">Ativos</button>
        <button class="chip" onclick="filtrarPorStatus('bloqueado', this)">Bloqueados</button>
      </div>

      <div class="tabela-admin">
        <table>
          <thead><tr><th>Corretor</th><th>Status</th><th>Dias de teste</th><th>Usuários</th><th>Criado em</th><th>Ação</th></tr></thead>
          <tbody id="linhas"></tbody>
        </table>
      </div>
      <div id="msgPainel"></div>
    </div>
  </div>

<script>
const supabaseClient = supabase.createClient(window.CORRETOR_PRO_SUPABASE_URL, window.CORRETOR_PRO_SUPABASE_ANON_KEY);

const SVG_OLHO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const SVG_OLHO_FECHADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

function alternarSenha(id, btn) {
  const campo = document.getElementById(id);
  const oculto = campo.type === 'password';
  campo.type = oculto ? 'text' : 'password';
  btn.innerHTML = oculto ? SVG_OLHO_FECHADO : SVG_OLHO;
  btn.setAttribute('aria-label', oculto ? 'Ocultar senha' : 'Mostrar senha');
}

document.querySelectorAll('.btn-olho').forEach(b => { b.innerHTML = SVG_OLHO; });

async function entrarAdmin() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const msg = document.getElementById('msgLogin');
  msg.className = ''; msg.textContent = '';

  try {
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
    if (error) throw error;

    const { data: souAdmin, error: adminErr } = await supabaseClient
      .from('platform_admins')
      .select('user_id');
    if (adminErr) throw adminErr;

    if (!souAdmin || !souAdmin.length) {
      msg.className = 'erro';
      msg.textContent = 'Esta conta não é administradora da plataforma.';
      await supabaseClient.auth.signOut();
      return;
    }

    document.getElementById('areaLogin').style.display = 'none';
    document.getElementById('areaPainel').style.display = '';
    carregarEmpresas();
  } catch (e) {
    msg.className = 'erro';
    msg.textContent = 'Erro ao entrar: ' + (e.message || e);
  }
}

const STATUS_LABEL = { teste: 'Teste', ativo: 'Ativo', bloqueado: 'Bloqueado' };
let ultimosDados = [];
let filtroStatus = 'todos';
let filtroBusca = '';

// O nome vem de quem se cadastra (não é fixo no código) — sem escapar, um nome com
// HTML/script quebraria ou injetaria código na tela do administrador.
function escapeHtml(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function iniciais(nome) {
  const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return '?';
  return (partes[0][0] + (partes.length > 1 ? partes[partes.length - 1][0] : '')).toUpperCase();
}

async function carregarEmpresas() {
  const msg = document.getElementById('msgPainel');
  const { data, error } = await supabaseClient
    .from('admin_visao_empresas')
    .select('*')
    .order('criado_em', { ascending: false });
  if (error) { msg.className = 'erro'; msg.textContent = error.message; return; }
  ultimosDados = data || [];
  renderizarPainel();
}

function renderizarPainel() {
  const porStatus = { teste: 0, ativo: 0, bloqueado: 0 };
  ultimosDados.forEach(e => { if (porStatus[e.status] !== undefined) porStatus[e.status]++; });
  document.getElementById('statTotal').textContent = ultimosDados.length;
  document.getElementById('statTeste').textContent = porStatus.teste;
  document.getElementById('statAtivo').textContent = porStatus.ativo;
  document.getElementById('statBloqueado').textContent = porStatus.bloqueado;

  const busca = filtroBusca.trim().toLowerCase();
  const filtrados = ultimosDados.filter(e => {
    if (filtroStatus !== 'todos' && e.status !== filtroStatus) return false;
    if (busca && !String(e.nome || '').toLowerCase().includes(busca)) return false;
    return true;
  });

  const linhas = document.getElementById('linhas');
  linhas.innerHTML = filtrados.map(e => `
    <tr>
      <td><div class="nome-corretor"><div class="avatar-admin" style="background:var(--st-${e.status === 'ativo' ? 'ativo' : e.status === 'bloqueado' ? 'bloq' : 'teste'})">${escapeHtml(iniciais(e.nome))}</div>${escapeHtml(e.nome)}</div></td>
      <td><span class="pill ${e.status}">${escapeHtml(STATUS_LABEL[e.status] || e.status)}</span></td>
      <td>${e.status === 'teste' ? e.dias_restantes_teste : '—'}</td>
      <td>${e.qtd_usuarios}</td>
      <td>${new Date(e.criado_em).toLocaleDateString('pt-BR')}</td>
      <td>
        <div class="acoes-linha">
          <button class="pequeno" style="width:auto" onclick="marcarPago('${e.id}')">Marcar pago</button>
          <button class="pequeno secundario" style="width:auto" onclick="bloquear('${e.id}')">Bloquear</button>
          <button class="pequeno secundario" style="width:auto" onclick="estenderTeste('${e.id}')">+7 dias teste</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function filtrarPorStatus(status, btn) {
  filtroStatus = status;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selecionado'));
  btn.classList.add('selecionado');
  renderizarPainel();
}

function buscarCorretor(valor) {
  filtroBusca = valor;
  renderizarPainel();
}

async function marcarPago(id) {
  const { error } = await supabaseClient.from('organizations').update({ status: 'ativo' }).eq('id', id);
  if (error) return alert('Erro: ' + error.message);
  carregarEmpresas();
}

async function bloquear(id) {
  const { error } = await supabaseClient.from('organizations').update({ status: 'bloqueado' }).eq('id', id);
  if (error) return alert('Erro: ' + error.message);
  carregarEmpresas();
}

async function estenderTeste(id) {
  const { data: atual } = await supabaseClient.from('organizations').select('trial_expira_em').eq('id', id).single();
  const base = atual && new Date(atual.trial_expira_em) > new Date() ? new Date(atual.trial_expira_em) : new Date();
  base.setDate(base.getDate() + 7);
  const { error } = await supabaseClient.from('organizations').update({ status: 'teste', trial_expira_em: base.toISOString() }).eq('id', id);
  if (error) return alert('Erro: ' + error.message);
  carregarEmpresas();
}
</script>
</body>
</html>
