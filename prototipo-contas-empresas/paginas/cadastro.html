<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar empresa — Corretor Pro (prévia)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div>
    <div class="marca">
      <img src="logo-cp.png" alt="">
      <b>Corretor <strong>Pro</strong></b>
    </div>
  <div class="cartao">
    <div class="selo-proto">PRÉVIA — assim vai ficar a tela de criar conta</div>
    <h1>Criar uma empresa nova</h1>
    <p class="sub">A empresa nasce vazia — sem herdar nenhum cliente de outra conta.</p>

    <label>Nome da empresa/imobiliária</label>
    <input id="nomeEmpresa" placeholder="Ex.: Imobiliária Nova Vista">
    <label>Seu e-mail</label>
    <input id="email" type="email" placeholder="voce@suaempresa.com">
    <label>Crie uma senha</label>
    <input id="senha" type="password" placeholder="••••••">
    <button onclick="cadastrar()">Criar empresa e entrar</button>
    <div id="msg"></div>

    <div class="linkbar">Já tem conta? <a href="login.html">Entrar</a></div>
  </div>
  </div>

<script>
async function cadastrar() {
  const nomeEmpresa = document.getElementById('nomeEmpresa').value.trim();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    const r = await fetch('/api/cadastro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nomeEmpresa, email, senha })
    });
    const d = await r.json();
    if (!d.ok) { msg.className = 'erro'; msg.textContent = d.error; return; }
    localStorage.setItem('protótipoToken', d.token);
    localStorage.setItem('protótipoEmpresa', d.empresaNome);
    localStorage.setItem('protótipoNome', d.nome);
    location.href = 'painel.html';
  } catch (e) {
    msg.className = 'erro';
    msg.textContent = 'Erro ao criar: ' + e.message;
  }
}
</script>
</body>
</html>
