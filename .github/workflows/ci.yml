name: CI

# Roda a suíte do projeto (npm test — node --check em toda a API + os arquivos tests/*.test.mjs)
# em toda alteração enviada ao GitHub.
#
# v1324 — a auditoria de 20/08/2026 apontou que "teste vermelho ≠ produção bloqueada": este
# workflow avisava, mas não impedia nada. O bloqueio de verdade passou a ser feito no ponto que
# ninguém consegue contornar sem querer: a PUBLICAÇÃO. O vercel.json agora publica com
# `npm test && node build.js`, então suíte vermelha = build da Vercel falha = a versão anterior
# continua no ar. Este workflow continua existindo por dois motivos: dá o "x"/"✓" visível no PR
# antes de mesclar (mais rápido que descobrir na publicação) e é a checagem que pode ser marcada
# como obrigatória no GitHub (Settings → Rules/Branches), que é o único passo que depende de um
# clique do dono.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
