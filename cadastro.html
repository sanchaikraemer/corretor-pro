<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — Corretor Pro</title>
<link rel="stylesheet" href="contas-estilo.css?v=__VERSION__">
<script src="vendor/supabase.js?v=__VERSION__"></script>
<script src="contas-config.js?v=__VERSION__"></script>
</head>
<body>
  <div>
    <div class="marca">
      <img src="logo-cp.png" alt="">
      <b>Corretor <strong>Pro</strong></b>
    </div>
    <div class="cartao">
      <h1>Criar sua conta</h1>
      <p class="sub">7 dias grátis pra testar. Sem cartão, sem compromisso.</p>

      <label>Seu nome</label>
      <input id="nomeEmpresa" placeholder="Ex.: João da Silva">
      <label>Seu WhatsApp (com DDD)</label>
      <input id="telefone" name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ex.: (51) 99999-9999">
      <div class="dois-campos">
        <div>
          <label>Cidade</label>
          <input id="cidade" name="cidade" autocomplete="address-level2" placeholder="Ex.: Porto Alegre">
        </div>
        <div>
          <label>Estado</label>
          <select id="estado" name="estado">
            <option value="">UF</option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option>
            <option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option>
            <option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option>
            <option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option>
            <option>SE</option><option>TO</option>
          </select>
        </div>
      </div>
      <label>Seu e-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="voce@email.com">
      <label>Crie uma senha</label>
      <div class="campo-senha">
        <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres">
        <button type="button" class="btn-olho" onclick="alternarSenha('senha', this)" aria-label="Mostrar senha"></button>
      </div>
      <button id="btnCriar" onclick="cadastrar()">Criar conta e começar teste grátis</button>
      <div id="msg"></div>
      <p class="sub" style="margin-top:14px;font-size:12px">Ao criar sua conta, você concorda com os <a href="termos.html">Termos de Uso</a> e a <a href="privacidade.html">Política de Privacidade</a>.</p>

      <div class="linkbar">Já tem conta? <a href="entrar.html">Entrar</a></div>
    </div>
  </div>

<script>
const supabaseClient = supabase.createClient(window.CORRETOR_PRO_SUPABASE_URL, window.CORRETOR_PRO_SUPABASE_ANON_KEY);

const SVG_OLHO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const SVG_OLHO_FECHADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

function alternarSenha(id, btn) {
  const campo = document.getElementById(id);
  const oculto = campo.type === 'password';
  campo.type = oculto ? 'text' : 'password';
  btn.innerHTML = oculto ? SVG_OLHO_FECHADO : SVG_OLHO;
  btn.setAttribute('aria-label', oculto ? 'Ocultar senha' : 'Mostrar senha');
}

// Ícone inicial (senha oculta -> mostra o olho aberto, convidando a clicar pra revelar).
document.querySelectorAll('.btn-olho').forEach(b => { b.innerHTML = SVG_OLHO; });

// v1130 — enquanto nenhum estado foi escolhido, o "UF" fica cinza de dica (igual ao "Ex.: Porto
// Alegre" do campo Cidade ao lado); assim que o corretor escolhe, vira texto normal. O CSS sozinho
// não consegue fazer isso — ele não enxerga qual opção está selecionada.
const campoEstado = document.getElementById('estado');
if (campoEstado) {
  const marcarEstado = () => campoEstado.classList.toggle('sem-escolha', !campoEstado.value);
  campoEstado.addEventListener('change', marcarEstado);
  marcarEstado();
}

// v1128 — a empresa passa a ser criada PELO SERVIDOR (api/criar-conta.js), não mais direto pelo
// navegador. É lá que mora a trava contra cadastro falso em massa (quantas contas novas saíram da
// mesma conexão de internet hoje) — trava que não pede nada de quem se cadastra: sem confirmar
// e-mail, sem captcha, entra na hora, do jeito que o dono pediu.
//
// Enquanto a migração 0013 não for aplicada no banco, o servidor devolve "migração pendente" e a
// gente cai no caminho antigo (criar a empresa direto daqui), pra NINGUÉM ficar sem se cadastrar
// nesse meio-tempo. Dentro do caminho antigo, a mesma reserva de sempre: se a migração 0011 também
// não tiver rodado, a chamada com os campos de contato falha e repetimos só com o nome.
async function criarEmpresaComContato(dados) {
  try {
    const { data: sessao } = await supabaseClient.auth.getSession();
    const token = sessao?.session?.access_token;
    if (token) {
      const resposta = await fetch('/api/criar-conta', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(dados)
      });
      const corpo = await resposta.json().catch(() => ({}));
      if (resposta.ok && corpo.ok) return { data: corpo.organizationId, error: null };
      // Limite de contas por conexão: é uma recusa de propósito, com texto pronto pra tela —
      // NUNCA cair no caminho antigo aqui, senão a trava não valeria de nada.
      if (resposta.status === 429) return { data: null, error: new Error(corpo.error || 'Limite de contas novas atingido nesta conexão.') };
      if (!corpo.migracaoPendente) return { data: null, error: new Error(corpo.error || 'Não foi possível criar a empresa.') };
    }
  } catch (_) { /* servidor fora do ar ou sem rede — cai no caminho antigo abaixo */ }

  const completo = await supabaseClient.rpc('criar_empresa_e_dono', {
    p_nome: dados.nome, p_telefone: dados.telefone, p_cidade: dados.cidade,
    p_estado: dados.estado, p_email: dados.email
  });
  if (!completo.error) return completo;
  return await supabaseClient.rpc('criar_empresa_e_dono', { p_nome: dados.nome });
}

async function cadastrar() {
  const nomeEmpresa = document.getElementById('nomeEmpresa').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  const cidade = document.getElementById('cidade').value.trim();
  const estado = document.getElementById('estado').value.trim();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnCriar');
  msg.className = '';
  msg.textContent = '';

  if (!nomeEmpresa || !telefone || !cidade || !estado || !email || !senha) {
    msg.className = 'erro';
    msg.textContent = 'Preencha todos os campos: nome, WhatsApp, cidade, estado, e-mail e senha.';
    return;
  }
  // Precisa ter pelo menos DDD + número (10 dígitos). Guardamos o que a pessoa digitou; a limpeza
  // pra virar link de WhatsApp acontece no painel.
  if ((telefone.replace(/\D/g, '')).length < 10) {
    msg.className = 'erro';
    msg.textContent = 'Digite um WhatsApp válido, com DDD (ex.: (51) 99999-9999).';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Criando conta...';

  try {
    // Nome e contato vão também nos metadados do login (options.data) — é o único jeito de
    // recuperá-los depois, no primeiro login, PARA QUANDO a confirmação de e-mail estiver
    // ativada (ver comentário abaixo sobre !signUpData.session).
    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
      email,
      password: senha,
      options: { data: { nome_empresa: nomeEmpresa, telefone, cidade, estado } }
    });
    if (signUpError) throw signUpError;

    if (!signUpData.session) {
      // O Supabase, por segurança, não avisa diretamente que um e-mail já tem conta — ele
      // devolve uma resposta "de sucesso" fingida (sem revelar se o e-mail existe ou não).
      // O jeito de diferenciar é checar "identities": um cadastro genuinamente novo vem com
      // pelo menos uma; um e-mail que já existe vem com essa lista vazia.
      const jaExiste = Array.isArray(signUpData.user?.identities) && signUpData.user.identities.length === 0;
      msg.className = jaExiste ? 'erro' : 'ok';
      msg.textContent = jaExiste
        ? 'Esse e-mail já tem uma conta. Em vez de criar outra, clique em "Entrar".'
        // Com a confirmação de e-mail ativada, ainda NÃO existe sessão aqui — não dá pra criar
        // a empresa agora (o comando exige login). O nome digitado já foi salvo junto com o
        // cadastro (nome_empresa) e entrar.html cria a empresa sozinho no primeiro login, assim
        // que a sessão de verdade existir — não é preciso repetir esse passo.
        : 'Conta criada! Confirme seu e-mail (verifique a caixa de entrada) e depois faça login — sua empresa é criada automaticamente no primeiro acesso.';
      btn.disabled = false;
      btn.textContent = 'Criar conta e começar teste grátis';
      return;
    }

    // v1165 — conta nova neste aparelho: o que estava guardado aqui é de outra pessoa (Cérebro em
    // cópia local, importação pendente, ZIP compartilhado, nomes de clientes do lembrete) e vai
    // embora antes de a conta nova começar. Nunca pode impedir o cadastro.
    try {
      const dadosLocais = await import('./js/dados-locais.js?v=__VERSION__');
      await dadosLocais.garantirDonoDosDadosLocais(signUpData.user?.id);
    } catch (_) {}

    const { error: rpcError } = await criarEmpresaComContato({ nome: nomeEmpresa, telefone, cidade, estado, email });
    if (rpcError) throw rpcError;

    msg.className = 'ok';
    msg.textContent = 'Conta criada! Seu teste grátis de 7 dias começou agora. Entrando...';
    // v1134 — quem acabou de criar a conta JÁ É cliente: ao voltar pra tela de entrar ele precisa
    // ver o login, não o convite pra criar conta (que ele acabou de fazer).
    try { localStorage.setItem('cp-ja-entrou', '1'); } catch (_) {}
    setTimeout(() => { location.href = 'entrar.html'; }, 1200);
  } catch (e) {
    msg.className = 'erro';
    // v1151 — print do dono ao criar a segunda conta de teste: a tela mostrou "Erro ao criar conta:
    // User already registered" — em inglês, cru do Supabase, sem dizer o que fazer. Quem está
    // testando o app com corretores não pode topar com isso. Aqui as mensagens comuns viram
    // português com a AÇÃO ao lado; o que não estiver na lista continua aparecendo como veio (é
    // melhor um texto estranho que nenhuma informação).
    msg.innerHTML = cpErroCadastroEmPortugues(e);
    btn.disabled = false;
    btn.textContent = 'Criar conta e começar teste grátis';
  }
}

// v1151 — tradução das falhas de cadastro que o corretor pode ver de verdade.
function cpErroCadastroEmPortugues(e){
  const cru = String(e?.message || e || '').trim();
  const baixo = cru.toLowerCase();
  const entrar = ' <a href="entrar.html" style="color:var(--cp-coral,#FF6258);font-weight:900">Entrar</a>';
  const recuperar = ' <a href="recuperar-senha.html" style="color:var(--cp-coral,#FF6258);font-weight:900">Esqueci minha senha</a>';
  if (baixo.includes('already registered') || baixo.includes('already been registered') || baixo.includes('user already exists')) {
    return '<b>Esse e-mail já tem conta.</b> Use outro e-mail, ou entre com este.' + entrar + ' ·' + recuperar;
  }
  if (baixo.includes('invalid email') || baixo.includes('email address') && baixo.includes('invalid')) {
    return '<b>E-mail inválido.</b> Confira se está escrito certinho (exemplo: nome@gmail.com).';
  }
  if (baixo.includes('password') && (baixo.includes('at least') || baixo.includes('short') || baixo.includes('6 characters'))) {
    return '<b>Senha curta.</b> Use pelo menos 6 caracteres.';
  }
  if (baixo.includes('rate limit') || baixo.includes('too many requests') || baixo.includes('for security purposes')) {
    return '<b>Muitas tentativas em pouco tempo.</b> Espere um minuto e tente de novo.';
  }
  if (baixo.includes('failed to fetch') || baixo.includes('networkerror') || baixo.includes('load failed')) {
    return '<b>Sem conexão.</b> Confira a internet do aparelho e toque em criar conta de novo.';
  }
  if (baixo.includes('cadastros') || baixo.includes('limite')) {
    // Trava contra cadastro falso em massa (api/criar-conta.js) já responde em português.
    return '<b>' + cru + '</b>';
  }
  return 'Não consegui criar a conta agora: ' + cru;
}
</script>
</body>
</html>
