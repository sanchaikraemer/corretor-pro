<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — Corretor Pro</title>
<link rel="stylesheet" href="contas-estilo.css?v=__VERSION__">
<script src="vendor/supabase.js?v=__VERSION__"></script>
<script src="contas-config.js?v=__VERSION__"></script>
</head>
<body>
  <div>
    <div class="marca">
      <img src="logo-cp.png" alt="">
      <b>Corretor <strong>Pro</strong></b>
    </div>
    <div class="cartao">
      <h1>Criar sua conta</h1>
      <p class="sub">7 dias grátis pra testar. Sem cartão, sem compromisso.</p>

      <label>Nome da sua imobiliária/empresa</label>
      <input id="nomeEmpresa" placeholder="Ex.: Imobiliária Nova Vista">
      <label>Seu e-mail</label>
      <input id="email" type="email" placeholder="voce@suaempresa.com">
      <label>Crie uma senha</label>
      <div class="campo-senha">
        <input id="senha" type="password" placeholder="mínimo 6 caracteres">
        <button type="button" class="btn-olho" onclick="alternarSenha('senha', this)" aria-label="Mostrar senha"></button>
      </div>
      <button id="btnCriar" onclick="cadastrar()">Criar conta e começar teste grátis</button>
      <div id="msg"></div>

      <div class="linkbar">Já tem conta? <a href="entrar.html">Entrar</a></div>
    </div>
  </div>

<script>
const supabaseClient = supabase.createClient(window.CORRETOR_PRO_SUPABASE_URL, window.CORRETOR_PRO_SUPABASE_ANON_KEY);

const SVG_OLHO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const SVG_OLHO_FECHADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

function alternarSenha(id, btn) {
  const campo = document.getElementById(id);
  const oculto = campo.type === 'password';
  campo.type = oculto ? 'text' : 'password';
  btn.innerHTML = oculto ? SVG_OLHO_FECHADO : SVG_OLHO;
  btn.setAttribute('aria-label', oculto ? 'Ocultar senha' : 'Mostrar senha');
}

// Ícone inicial (senha oculta -> mostra o olho aberto, convidando a clicar pra revelar).
document.querySelectorAll('.btn-olho').forEach(b => { b.innerHTML = SVG_OLHO; });

async function cadastrar() {
  const nomeEmpresa = document.getElementById('nomeEmpresa').value.trim();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnCriar');
  msg.className = '';
  msg.textContent = '';

  if (!nomeEmpresa || !email || !senha) {
    msg.className = 'erro';
    msg.textContent = 'Preencha o nome da empresa, e-mail e senha.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Criando conta...';

  try {
    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email, password: senha });
    if (signUpError) throw signUpError;

    if (!signUpData.session) {
      // O Supabase, por segurança, não avisa diretamente que um e-mail já tem conta — ele
      // devolve uma resposta "de sucesso" fingida (sem revelar se o e-mail existe ou não).
      // O jeito de diferenciar é checar "identities": um cadastro genuinamente novo vem com
      // pelo menos uma; um e-mail que já existe vem com essa lista vazia.
      const jaExiste = Array.isArray(signUpData.user?.identities) && signUpData.user.identities.length === 0;
      msg.className = jaExiste ? 'erro' : 'ok';
      msg.textContent = jaExiste
        ? 'Esse e-mail já tem uma conta. Em vez de criar outra, clique em "Entrar".'
        : 'Conta criada! Confirme seu e-mail (verifique a caixa de entrada) e depois faça login.';
      btn.disabled = false;
      btn.textContent = 'Criar conta e começar teste grátis';
      return;
    }

    const { error: rpcError } = await supabaseClient.rpc('criar_empresa_e_dono', { p_nome: nomeEmpresa });
    if (rpcError) throw rpcError;

    msg.className = 'ok';
    msg.textContent = 'Conta criada! Seu teste grátis de 7 dias começou agora. Entrando...';
    setTimeout(() => { location.href = 'entrar.html'; }, 1200);
  } catch (e) {
    msg.className = 'erro';
    msg.textContent = 'Erro ao criar conta: ' + (e.message || e);
    btn.disabled = false;
    btn.textContent = 'Criar conta e começar teste grátis';
  }
}
</script>
</body>
</html>
