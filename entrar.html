<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Corretor Pro</title>
<link rel="stylesheet" href="contas-estilo.css?v=__VERSION__">
<script src="vendor/supabase.js?v=__VERSION__"></script>
<script src="contas-config.js?v=__VERSION__"></script>
</head>
<body>
  <div>
    <!-- v1134 — DOIS ESTADOS NA MESMA TELA, decisão do dono ("os dois").
         Quem chega pela primeira vez neste aparelho vê o CONVITE: o que o produto faz e um botão
         só, criar conta. Quem já entrou alguma vez cai direto no LOGIN, sem explicação nenhuma —
         esse não quer ler nada, quer digitar a senha. Antes, uma tela só atendia os dois e por isso
         não atendia bem nenhum: o primeiro corretor que recebia o link do dono via um formulário de
         senha de uma conta que ele ainda não tinha. Quem decide qual estado aparece é a memória do
         próprio aparelho (ver cpJaEntrouAqui, no fim do arquivo). -->
    <div id="convite" style="display:none;max-width:400px">
      <img src="logo-cp.png" alt="" style="width:52px;height:52px;border-radius:14px;display:block;margin-bottom:20px">
      <div class="selo-teste">7 dias grátis · sem cartão</div>
      <h1 class="chamada">Suas conversas do WhatsApp viram <em>plano de ação</em>.</h1>
      <p class="apoio">Exporte uma conversa e o Corretor Pro diz quem atender agora, por quê, quando e o que falar.</p>
      <button type="button" onclick="location.href='cadastro.html'">Criar minha conta grátis</button>
      <div class="linkbar" style="text-align:left">Já tem conta? <a href="#" onclick="mostrarLogin(true); return false;">Entrar</a></div>
    </div>

    <div id="areaLogin" style="display:none">
    <div class="marca">
      <img src="logo-cp.png" alt="">
      <b>Corretor <strong>Pro</strong></b>
    </div>
    <div class="cartao">
      <h1>Entrar</h1>
      <p class="sub">Cada corretor entra com sua própria conta.</p>

      <label>E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="seuemail@email.com">
      <label>Senha</label>
      <div class="campo-senha">
        <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="••••••">
        <button type="button" class="btn-olho" onclick="alternarSenha('senha', this)" aria-label="Mostrar senha"></button>
      </div>
      <button id="btnEntrar" onclick="entrar()">Entrar</button>
      <div id="msg"></div>

      <div class="linkbar"><a href="recuperar-senha.html">Esqueci minha senha</a></div>
      <!-- v1134 — "Criar conta grátis" era a menor letra da tela, num rodapé. Virou botão de
           verdade: é a ação mais importante pra quem ainda não é cliente, e mesmo no estado de
           login existe quem chegue aqui sem conta (link compartilhado de segunda mão). -->
      <div class="separador-conta">ainda não tem conta?</div>
      <button type="button" class="btn-fora" onclick="location.href='cadastro.html'">Criar conta grátis · 7 dias</button>
      <!-- v1123 — o link "Acesso por chave de segurança" saiu daqui. O caminho antigo (chave
           compartilhada, anterior às contas por login) foi DESLIGADO em produção na v1119/v1120
           (CORRETOR_PRO_LEGADO_DESLIGADO=sim na Vercel): o servidor recusa esse acesso, então o
           link só podia confundir quem o visse — clicava, informava a chave e tomava erro. Hoje
           só existe uma porta de entrada: e-mail e senha. -->
    </div>
    </div>
  </div>

<script>
const supabaseClient = supabase.createClient(window.CORRETOR_PRO_SUPABASE_URL, window.CORRETOR_PRO_SUPABASE_ANON_KEY);

const SVG_OLHO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const SVG_OLHO_FECHADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

function alternarSenha(id, btn) {
  const campo = document.getElementById(id);
  const oculto = campo.type === 'password';
  campo.type = oculto ? 'text' : 'password';
  btn.innerHTML = oculto ? SVG_OLHO_FECHADO : SVG_OLHO;
  btn.setAttribute('aria-label', oculto ? 'Ocultar senha' : 'Mostrar senha');
}

document.querySelectorAll('.btn-olho').forEach(b => { b.innerHTML = SVG_OLHO; });

// v1134 — a memória que decide qual dos dois estados aparece. Só um login que DEU CERTO (ou um
// cadastro concluído) marca o aparelho como conhecido; abrir a tela e ir embora não marca nada.
// Fica no aparelho, não na conta: um corretor que entra no computador do escritório pela primeira
// vez vê o convite lá também, e tudo bem — ele clica em "Entrar" uma vez e nunca mais vê.
const CP_JA_ENTROU = 'cp-ja-entrou';
function cpJaEntrouAqui() {
  try { return localStorage.getItem(CP_JA_ENTROU) === '1'; } catch (_) { return false; }
}
function cpMarcarQueJaEntrou() {
  try { localStorage.setItem(CP_JA_ENTROU, '1'); } catch (_) {}
}
// focar=true só quando a pessoa PEDIU o login (clicou em "Já tem conta?"). Na abertura normal da
// tela não focamos: no celular isso abre o teclado sozinho e empurra a tela pra cima antes de ela
// ter decidido qualquer coisa.
function mostrarLogin(focar) {
  document.getElementById('convite').style.display = 'none';
  document.getElementById('areaLogin').style.display = 'block';
  // Não marca o aparelho aqui de propósito: clicar em "Já tem conta?" é uma intenção, não uma
  // prova. Se a pessoa se enganou e fechou, na próxima vez ela volta a ver o convite.
  if (focar) { try { document.getElementById('email').focus(); } catch (_) {} }
}
function mostrarConvite() {
  document.getElementById('convite').style.display = 'block';
  document.getElementById('areaLogin').style.display = 'none';
}
// Decide ANTES de a tela aparecer, pra não piscar um estado e trocar pro outro na frente da pessoa.
if (cpJaEntrouAqui()) mostrarLogin(false); else mostrarConvite();


async function entrar() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnEntrar');
  msg.className = '';
  msg.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    const { data: loginData, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
    if (error) throw error;

    // Busca a empresa PELO VÍNCULO do próprio usuário (memberships), não pela visão geral —
    // quem também é administrador da plataforma enxerga todas as empresas na admin_visao_empresas,
    // e ali não dava pra saber qual delas era a própria (podia mostrar o status de outra empresa
    // por engano). Filtrando por memberships.user_id = eu mesmo, é sempre a empresa certa.
    // v1013: se o usuário tiver MAIS de um vínculo (não deveria acontecer no fluxo normal, mas
    // pode ocorrer em bases antigas/migradas), busca todos e usa o mais recente — nunca "o
    // primeiro que o banco devolver" (ordem não é garantida sem order()).
    const meuId = loginData.user.id;

    // v1165 — se este aparelho estava com os dados de OUTRA conta guardados (Cérebro em cópia
    // local, importação pendente, ZIP compartilhado, nomes de clientes do lembrete), eles são
    // apagados AGORA, antes de o app abrir. É esta a passagem em que o aparelho troca de dono.
    // Nunca pode impedir o login: se falhar, o acesso continua.
    try {
      const dadosLocais = await import('./js/dados-locais.js?v=__VERSION__');
      await dadosLocais.garantirDonoDosDadosLocais(meuId);
    } catch (_) {}
    const buscarVinculo = () => supabaseClient
      .from('memberships')
      .select('papel, criado_em, organizations(id, nome, status, trial_expira_em)')
      .eq('user_id', meuId)
      .order('criado_em', { ascending: false })
      .limit(1)
      .maybeSingle();

    let { data: vinculo, error: empError } = await buscarVinculo();
    if (empError) throw empError;

    // v1013 — com a confirmação de e-mail ativada no Supabase, o cadastro não tinha sessão pra
    // criar a empresa na hora (RPC exige login). Ficava com o login pronto e SEM empresa pra
    // sempre. Aqui, no primeiro login de verdade (sessão já existe), cria a empresa que faltou,
    // usando o nome que o cadastro salvou em user_metadata.nome_empresa.
    if (!vinculo || !vinculo.organizations) {
      const meta = loginData.user.user_metadata || {};
      const nomeSalvoNoCadastro = String(meta.nome_empresa || '').trim();
      const nomeParaEmpresa = nomeSalvoNoCadastro || String(email.split('@')[0] || 'Minha empresa').trim();
      // Cria com os dados de contato salvos no cadastro (options.data). Se a migração 0011 ainda
      // não tiver sido aplicada, a função é a versão antiga (só nome) e a chamada completa falha —
      // aí tentamos de novo só com o nome, pra o primeiro login nunca travar por isso.
      // v1128 — a empresa é criada pelo servidor (api/criar-conta.js), igual ao cadastro: é lá que
      // fica a trava contra cadastro falso em massa. Quem já tem empresa recebe a que existe, sem
      // gastar nenhuma tentativa da conexão.
      // v1185 — e é o ÚNICO caminho: se o servidor recusar, a pessoa vê o motivo em vez de a conta
      // nascer por fora da trava (ver o bloco comentado logo abaixo).
      const criarPeloServidor = async () => {
        try {
          const token = loginData.session?.access_token;
          if (!token) return { feito: false };
          const resposta = await fetch('/api/criar-conta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({
              nome: nomeParaEmpresa,
              telefone: String(meta.telefone || '').trim(),
              cidade: String(meta.cidade || '').trim(),
              estado: String(meta.estado || '').trim(),
              email
            })
          });
          const corpo = await resposta.json().catch(() => ({}));
          if (resposta.ok && corpo.ok) return { feito: true };
          if (resposta.status === 429) return { feito: false, erroFinal: new Error(corpo.error || 'Limite de contas novas atingido nesta conexão.') };
          // v1185 — recusa do servidor agora aparece com o motivo. Antes ela era engolida e o
          // navegador criava a empresa por fora da trava; sem isso, o silêncio viraria a tela
          // genérica de "não encontrei conta vinculada", sem dizer o que houve.
          return { feito: false, erroFinal: new Error(corpo.error || 'Não foi possível criar sua empresa agora. Tente de novo em instantes ou fale com o suporte.') };
        } catch (_) { return { feito: false }; }
      };

      // v1185 — AQUI EXISTIA UM CAMINHO DE RESERVA QUE ANULAVA A PRÓPRIA TRAVA. Se o servidor
      // avisasse que a migração 0013 não estava aplicada, o navegador criava a empresa sozinho,
      // chamando o banco direto. Só que a 0013 existe justamente pra tirar esse poder do navegador
      // (a chave pública do Supabase está no código, à vista de qualquer um) — ou seja, a regra
      // era: "se a trava de segurança estiver faltando, volte a usar o caminho sem trava". As três
      // auditorias de 08/2026 apontaram isso. A 0013 está aplicada no banco desde então (o próprio
      // banco confirma em /api/diagnostico?mode=banco), e o caminho antigo já nem funcionava mais:
      // a permissão foi revogada, então ele só devolvia um erro cru em inglês.
      const peloServidor = await criarPeloServidor();
      if (peloServidor.erroFinal) throw peloServidor.erroFinal;
      if (peloServidor.feito) {
        const retry = await buscarVinculo();
        vinculo = retry.data;
      }
    }

    const minhaEmpresa = vinculo && vinculo.organizations;
    if (!minhaEmpresa) {
      msg.className = 'erro';
      msg.textContent = 'Login ok, mas não encontrei nenhuma conta vinculada a este login. Tente novamente ou fale com o suporte.';
      btn.disabled = false; btn.textContent = 'Entrar';
      return;
    }

    const diasRestantes = Math.max(0, Math.ceil((new Date(minhaEmpresa.trial_expira_em) - new Date()) / 86400000));
    const bloqueado = minhaEmpresa.status === 'bloqueado'
      || (minhaEmpresa.status === 'teste' && diasRestantes <= 0);

    if (bloqueado) {
      // v1118 — antes, o teste vencido caía numa mensagem seca, sem preço nem botão: o momento de
      // maior intenção de compra terminava sem saída. Agora mostra os planos e um botão que abre o
      // WhatsApp comercial já com a mensagem pronta. Preços iguais aos do convite de limite
      // (api/_pipeline.js precoPlano) — se mudar lá, mudar aqui. O nome vem do banco: escapado.
      // v1199 — preço recalibrado: R$ 67/R$ 97 (03/08) virou R$ 49,90/R$ 99,90 (decisão do dono).
      const zap = '5554999013331';
      const nomeSeguro = String(minhaEmpresa.nome ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const textoZap = encodeURIComponent('Olá! Meu teste grátis do Corretor Pro acabou e quero assinar um plano.');
      msg.className = 'erro';
      msg.innerHTML = `Seu teste grátis acabou, ${nomeSeguro}. Continue usando o Corretor Pro: `
        + `<b>Pro por R$ 49,90/mês</b> ou <b>Pro Master por R$ 99,90/mês</b>.`
        + `<a href="https://wa.me/${zap}?text=${textoZap}" target="_blank" rel="noopener" class="botao-zap-teste">Assinar pelo WhatsApp</a>`;
      btn.disabled = false; btn.textContent = 'Entrar';
      return;
    }

    msg.className = 'ok';
    const situacao = minhaEmpresa.status === 'teste'
      ? `restam ${diasRestantes} dia(s) de teste grátis`
      : 'assinatura ativa';

    // v1004 — a separação de dados por corretor ficou pronta (v997–v1003): agora TODO corretor
    // com a conta em dia entra direto no sistema completo. A sessão fica salva neste navegador
    // e o app passa a usá-la nas chamadas — cada um vê só a própria carteira e o próprio Cérebro.
    msg.textContent = `Login confirmado, ${minhaEmpresa.nome} — ${situacao}. Abrindo o sistema...`;
    btn.textContent = 'Login confirmado ✓';
    // v1134 — daqui em diante este aparelho abre direto no login, sem passar pelo convite.
    cpMarcarQueJaEntrou();
    setTimeout(() => { window.location.href = '/'; }, 600);
  } catch (e) {
    msg.className = 'erro';
    msg.textContent = 'Erro ao entrar: ' + (e.message || e);
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}
// v1123 — o gatilho do "Acesso por chave de segurança" saiu junto com o link (ver comentário no
// HTML acima): o caminho antigo está desligado no servidor, então guardar a chave neste aparelho
// não abriria nada — só geraria erro depois. Entrada única: e-mail e senha.
</script>
</body>
</html>
