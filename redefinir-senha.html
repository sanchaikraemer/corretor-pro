<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar nova senha — Corretor Pro</title>
<link rel="stylesheet" href="contas-estilo.css?v=__VERSION__">
<script src="vendor/supabase.js?v=__VERSION__"></script>
<script src="contas-config.js?v=__VERSION__"></script>
</head>
<body>
  <div>
    <div class="marca">
      <img src="logo-cp.png" alt="">
      <b>Corretor <strong>Pro</strong></b>
    </div>
    <div class="cartao">
      <h1>Criar nova senha</h1>
      <p class="sub">Você clicou no link de recuperação. Escolha uma senha nova pra sua conta.</p>

      <label>Nova senha</label>
      <div class="campo-senha">
        <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres">
        <button type="button" class="btn-olho" onclick="alternarSenha('senha', this)" aria-label="Mostrar senha"></button>
      </div>
      <label>Confirme a nova senha</label>
      <div class="campo-senha">
        <input id="senha2" name="senha2" type="password" autocomplete="new-password" placeholder="repita a senha">
        <button type="button" class="btn-olho" onclick="alternarSenha('senha2', this)" aria-label="Mostrar senha"></button>
      </div>
      <button id="btnSalvar" onclick="salvarNovaSenha()">Salvar nova senha</button>
      <div id="msg"></div>

      <div class="linkbar"><a href="entrar.html">Voltar para o login</a></div>
    </div>
  </div>

<script>
const supabaseClient = supabase.createClient(window.CORRETOR_PRO_SUPABASE_URL, window.CORRETOR_PRO_SUPABASE_ANON_KEY);

const SVG_OLHO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const SVG_OLHO_FECHADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

function alternarSenha(id, btn) {
  const campo = document.getElementById(id);
  const oculto = campo.type === 'password';
  campo.type = oculto ? 'text' : 'password';
  btn.innerHTML = oculto ? SVG_OLHO_FECHADO : SVG_OLHO;
  btn.setAttribute('aria-label', oculto ? 'Ocultar senha' : 'Mostrar senha');
}

document.querySelectorAll('.btn-olho').forEach(b => { b.innerHTML = SVG_OLHO; });

async function salvarNovaSenha() {
  const senha = document.getElementById('senha').value;
  const senha2 = document.getElementById('senha2').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnSalvar');
  msg.className = '';
  msg.textContent = '';

  if (!senha || senha.length < 6) {
    msg.className = 'erro';
    msg.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
    return;
  }
  if (senha !== senha2) {
    msg.className = 'erro';
    msg.textContent = 'As duas senhas não são iguais.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    // O link do e-mail já deixa uma sessão de recuperação pronta no navegador (o próprio
    // supabase-js lê isso da URL ao carregar a página) — getSession() garante que essa leitura
    // terminou antes de tentarmos trocar a senha.
    const { data: sessionData } = await supabaseClient.auth.getSession();
    if (!sessionData?.session) {
      msg.className = 'erro';
      msg.textContent = 'Este link de recuperação expirou ou já foi usado. Peça um novo em "Esqueci minha senha".';
      btn.disabled = false;
      btn.textContent = 'Salvar nova senha';
      return;
    }

    const { error } = await supabaseClient.auth.updateUser({ password: senha });
    if (error) throw error;

    msg.className = 'ok';
    msg.textContent = 'Senha alterada! Entrando...';
    setTimeout(() => { location.href = 'entrar.html'; }, 1200);
  } catch (e) {
    msg.className = 'erro';
    msg.textContent = 'Não foi possível salvar: ' + (e.message || e);
    btn.disabled = false;
    btn.textContent = 'Salvar nova senha';
  }
}
</script>
</body>
</html>
